[project]
name = "demotool"
version = "0.1.0"
description = "A tiny CSV report utility used as an agent-dispatch demo target."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
demotool = "demotool.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["demotool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
