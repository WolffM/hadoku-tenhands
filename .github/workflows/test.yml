name: Tests

# Runs the backend suite on pull requests. Until now this repo had no test
# workflow at all — the 1200+ tests only ever ran on a laptop — so a PR
# showed green because nothing had run, not because anything passed. That is
# fine while push-to-main is the norm and a human runs pytest locally, but it
# is not a gate, and the task-automation pipeline opens PRs that land on green.
# This is the thing that makes "green" mean something.
#
# As of 2026-08-04 that is literal: `backend pytest` is a required check on
# `main`, and the lander arms auto-merge, so this job is what decides whether
# an unreviewed change reaches production. Nothing else reads the diff.
#
# Note the `pull_request` event checks out the MERGE commit (refs/pull/N/merge),
# not the branch tip, so this verifies the branch against current `main`
# automatically — the same merge-result property the automation lander
# enforces before it pushes.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. Cancel it — this runs
# on a self-hosted box and there is no reason to hold a slot for a result
# nobody will read.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend pytest
    # SECURITY: never let a fork PR reach the self-hosted host. Same-repo
    # branches (the normal path, and everything the automation lander opens)
    # run here. Gated on author_association, NOT on head.repo.full_name: the
    # latter asks "is this a fork?", which also pushed our OWN collaborators off
    # the self-hosted suite whenever they worked from a fork — a normal way to
    # work, and not the question we mean to ask. What matters is whether the
    # author is authorized on this repo, which is exactly what
    # author_association answers, and GitHub computes it rather than the
    # submitter supplying it. An unauthorized author gets its signal from
    # `backend-fork` below instead. This is belt-and-suspenders with the repo's
    # "require approval for outside collaborators" Actions setting.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.pull_request.author_association)
    # The pm2 host via its tenhands registration. The `taskauto` label is
    # deliberately opt-in: the builder fleet (`hadoku-builder`) still serves
    # deploy/publish, and only workflows that ask for `taskauto` land here.
    runs-on: [self-hosted, pm2-host, taskauto]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Create an isolated venv
        # Deliberately NOT the repo's production .venv. This job runs on the
        # host that serves production, and pip-installing a pull request's
        # requirements into the venv that pm2 launches from would let an
        # unmerged branch change what production imports. The venv lives in
        # the runner workspace and dies with it.
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        # Test deps are separate from runtime deps and are never installed in
        # prod, so both files are needed here.
        run: |
          .venv-ci/bin/python -m pip install \
            -r backend/requirements.txt \
            -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          # This used to provide no secrets, on the reasoning that handing a
          # pull request a live credential to earn back one test was a bad
          # trade, and the suite ran green with exactly 1 skip.
          #
          # Both halves of that stopped being true on 2026-08-04.
          #
          # The skip was not a tidy opt-out. There are no `.env` files in this
          # ecosystem, so CLAUDE_CODE_OAUTH_TOKEN is never ambiently set and
          # the gate fired on the *normal* case — locally as well as here. A
          # plain `pytest` reported the same green whether or not the only
          # unmocked coverage of `score()` had run. And this job is now the
          # required check that gates auto-merge, so "green" here decides
          # whether unreviewed changes land.
          #
          # The trade also got cheaper than it looks. This runs on the same
          # self-hosted box, with the same label, as taskauto.yml — which
          # already hands this exact token to a job on that host. Fork PRs get
          # no secrets and need approval before touching a self-hosted runner,
          # so the marginal exposure is close to nil.
          #
          # Deliberately the token and NOT the vault service key: the key would
          # also unlock HADOKU_SITE_TOKEN, an admin PAT. The narrowest
          # credential that does the job is the right one. The test's
          # environment-first resolution picks this up and never calls the
          # broker, so CI needs no vault access at all.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude lives in ~/.local/bin, which is not on the runner's PATH.
          # Same override taskauto.yml sets, for the same reason; overridable via
          # the CLAUDE_BIN repo variable.
          CRIMSON_CLAUDE_BIN: ${{ vars.CLAUDE_BIN || '/home/hadoku/.local/bin/claude' }}
        # The suite runs with zero skips. A skip appearing here is a regression
        # to investigate, not the normal state.
        run: ../.venv-ci/bin/python -m pytest tests/ -q

  frontend:
    name: frontend lint + typecheck
    # The frontend had no CI at all: eslint, tsc and the icon gate ran only in a
    # local pre-commit hook, which `--no-verify` skips and which never runs for a
    # PR opened by the automation lander. Since that lander arms auto-merge on
    # green, "green" meant the backend suite passed and nothing had read a line
    # of TypeScript. This is what makes it mean the frontend too.
    #
    # Same author_association gate as `backend`, for a different reason: the
    # @wolffm/* packages come from GitHub Packages, so `pnpm install` needs
    # DEMO_PACKAGES_TOKEN. A fork PR gets no secrets and therefore cannot install
    # dependencies at all — there is no fork counterpart to write. Stated plainly
    # rather than papered over with a job that would only ever fail.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@wolffm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
        env:
          # Read-only packages PAT scoped to @wolffm reads, same as pages.yml.
          # NOT HADOKU_SITE_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.DEMO_PACKAGES_TOKEN }}

      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      # `lint` is eslint followed by lint:icons (the @wolffm/themes icon gate).
      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      # The gate is a worklist, not proof. Two of this migration's defects were
      # invisible to both eslint and the checker and only showed up in a build:
      # an icon name written as a \uXXXX escape is ASCII in source and a
      # pictograph in the bundle.
      - name: Build
        working-directory: frontend
        run: pnpm run build

  backend-fork:
    name: backend pytest (fork)
    # The signal for pull requests from an UNAUTHORIZED author, which the
    # self-hosted `backend` job deliberately refuses to run. Kept exactly
    # inverse to that job's condition so the two can never both fire, and never
    # both skip. GitHub-hosted, zero secrets, so
    # untrusted code never touches the production host or a live credential.
    # One test is deselected: test_score_integration_real_cli is the only
    # unmocked coverage of the LLM judge and needs CLAUDE_CODE_OAUTH_TOKEN,
    # which a fork PR has no way to obtain — the rest of the suite is fully
    # mocked and runs green here. A maintainer who wants the full gate re-pushes
    # the branch inside this repo, where the `backend` job runs it.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r backend/requirements.txt \
            -r backend/requirements-dev.txt
      - name: Run tests (mocked subset)
        working-directory: backend
        run: python -m pytest tests/ -q --deselect tests/temporal/test_judge.py::test_score_integration_real_cli
