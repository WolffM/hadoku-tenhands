name: Tests

# Runs the backend suite on pull requests. Until now this repo had no test
# workflow at all — the 1200+ tests only ever ran on a laptop — so a PR
# showed green because nothing had run, not because anything passed. That is
# fine while push-to-main is the norm and a human runs pytest locally, but it
# is not a gate, and the task-automation pipeline opens PRs that land on green.
# This is the thing that makes "green" mean something.
#
# As of 2026-08-04 that is literal: `backend pytest` is a required check on
# `main`, and the lander arms auto-merge, so this job is what decides whether
# an unreviewed change reaches production. Nothing else reads the diff.
#
# Note the `pull_request` event checks out the MERGE commit (refs/pull/N/merge),
# not the branch tip, so this verifies the branch against current `main`
# automatically — the same merge-result property the automation lander
# enforces before it pushes.
#
# ALSO ON PUSH TO MAIN, because `pull_request` alone verifies a path this repo
# does not exclusively use. Work lands here by direct push too — and a squash
# merge is itself a push whose result no `pull_request` run ever sees — so a
# PR-only trigger left those commits checked by NOTHING. `e2b7a07` is the
# worked example: its PR was green, it squashed onto main, and no run ever
# executed against what main actually became.
#
# This is DETECTION, not prevention: the commit has already landed by the time
# these jobs report, so a failure is a red main to fix forward rather than a
# blocked merge. That is the honest ceiling for a direct-push workflow, and it
# is still the difference between a visible red X and silence. Note what it
# does NOT weaken: `backend pytest` stays a required check on `main`, so the
# PR gate in front of an automation-lander merge is exactly as strict as before.
#
# Every job below already short-circuits its author_association gate with
# `github.event_name != 'pull_request'`, so a push runs the three real jobs
# unfiltered. `backend-fork` is the deliberate exception — it requires
# `pull_request`, so it stays skipped here rather than duplicating `backend`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete. Cancel it — this runs
# on a self-hosted box and there is no reason to hold a slot for a result
# nobody will read.
#
# NOT on main. There, cancelling is how a commit ends up with no verdict at
# all: the run for HEAD~1 dies the moment the next commit lands, and the whole
# point of the push trigger is that every landed commit gets one. Two commits
# in quick succession are worth two runs on a box that has the capacity.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend pytest
    # SECURITY: never let a fork PR reach the self-hosted host. Same-repo
    # branches (the normal path, and everything the automation lander opens)
    # run here. Gated on author_association, NOT on head.repo.full_name: the
    # latter asks "is this a fork?", which also pushed our OWN collaborators off
    # the self-hosted suite whenever they worked from a fork — a normal way to
    # work, and not the question we mean to ask. What matters is whether the
    # author is authorized on this repo, which is exactly what
    # author_association answers, and GitHub computes it rather than the
    # submitter supplying it. An unauthorized author gets its signal from
    # `backend-fork` below instead. This is belt-and-suspenders with the repo's
    # "require approval for outside collaborators" Actions setting.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.pull_request.author_association)
    # The pm2 host via its tenhands registration. The `taskauto` label is
    # deliberately opt-in: the builder fleet (`hadoku-builder`) still serves
    # deploy/publish, and only workflows that ask for `taskauto` land here.
    runs-on: [self-hosted, pm2-host, taskauto]
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Create an isolated venv
        # Deliberately NOT the repo's production .venv. This job runs on the
        # host that serves production, and pip-installing a pull request's
        # requirements into the venv that pm2 launches from would let an
        # unmerged branch change what production imports. The venv lives in
        # the runner workspace and dies with it.
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        # Test deps are separate from runtime deps and are never installed in
        # prod, so both files are needed here.
        run: |
          .venv-ci/bin/python -m pip install \
            -r backend/requirements.txt \
            -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          # This used to provide no secrets, on the reasoning that handing a
          # pull request a live credential to earn back one test was a bad
          # trade, and the suite ran green with exactly 1 skip.
          #
          # Both halves of that stopped being true on 2026-08-04.
          #
          # The skip was not a tidy opt-out. There are no `.env` files in this
          # ecosystem, so CLAUDE_CODE_OAUTH_TOKEN is never ambiently set and
          # the gate fired on the *normal* case — locally as well as here. A
          # plain `pytest` reported the same green whether or not the only
          # unmocked coverage of `score()` had run. And this job is now the
          # required check that gates auto-merge, so "green" here decides
          # whether unreviewed changes land.
          #
          # The trade also got cheaper than it looks. This runs on the same
          # self-hosted box, with the same label, as taskauto.yml — which
          # already hands this exact token to a job on that host. Fork PRs get
          # no secrets and need approval before touching a self-hosted runner,
          # so the marginal exposure is close to nil.
          #
          # Deliberately the token and NOT the vault service key: the key would
          # also unlock HADOKU_SITE_TOKEN, an admin PAT. The narrowest
          # credential that does the job is the right one. The test's
          # environment-first resolution picks this up and never calls the
          # broker, so CI needs no vault access at all.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # claude lives in ~/.local/bin, which is not on the runner's PATH.
          # Same override taskauto.yml sets, for the same reason; overridable via
          # the CLAUDE_BIN repo variable.
          CRIMSON_CLAUDE_BIN: ${{ vars.CLAUDE_BIN || '/home/hadoku/.local/bin/claude' }}
        # The suite runs with zero skips. A skip appearing here is a regression
        # to investigate, not the normal state.
        run: ../.venv-ci/bin/python -m pytest tests/ -q

  frontend:
    name: frontend lint + typecheck
    # The frontend had no CI at all: eslint, tsc and the icon gate ran only in a
    # local pre-commit hook, which `--no-verify` skips and which never runs for a
    # PR opened by the automation lander. Since that lander arms auto-merge on
    # green, "green" meant the backend suite passed and nothing had read a line
    # of TypeScript. This is what makes it mean the frontend too.
    #
    # Same author_association gate as `backend`, but NOT for the same reason —
    # this job is GitHub-hosted and takes no privileged secret, so it is not a
    # self-hosted exposure. It is gated because a fork PR's GITHUB_TOKEN cannot
    # read this org's packages, so `pnpm install` could not resolve @wolffm/*
    # and the job would only ever fail. Stated plainly rather than papered over.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Job-scoped so the backend jobs keep the workflow's default token. `packages`
    # is what the @wolffm/* install below reads.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@wolffm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
        env:
          # Built-in, repo-scoped, read-only for packages — same choice pages.yml
          # made in 721d5e7, and it works here for the same reason: every
          # @wolffm package this tree installs (themes, task-ui-components,
          # logger) is PUBLIC. No PAT to mint, rotate, or leak on a hosted
          # runner. If a private package ever enters the tree this breaks loudly
          # at install; the fix is a read:packages PAT, never HADOKU_SITE_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Prettier drift is not cosmetic in a repo whose pre-commit hook runs
      # `format --write`: seven files had drifted, so the next person to commit
      # anything picked up their reformatting as unrelated churn in the diff.
      # Checking it here keeps that from rebuilding.
      - name: Format check
        working-directory: frontend
        run: pnpm run format:check

      - name: Typecheck
        working-directory: frontend
        run: pnpm run typecheck

      # The pure modules under src/utils had no test whose import path reached
      # them, so `tsc` was their only gate and every change to the diff parser
      # arrived unverified. These need no browser and no server, so they run
      # here in the cheap job rather than alongside the e2e suite.
      - name: Unit tests
        working-directory: frontend
        run: pnpm run test:unit

      # `lint` is eslint followed by lint:icons (the @wolffm/themes icon gate).
      - name: Lint
        working-directory: frontend
        run: pnpm run lint

      # The gate is a worklist, not proof. Two of this migration's defects were
      # invisible to both eslint and the checker and only showed up in a build:
      # an icon name written as a \uXXXX escape is ASCII in source and a
      # pictograph in the bundle.
      - name: Build
        working-directory: frontend
        run: pnpm run build

  e2e:
    name: frontend e2e (playwright)
    # 49 specs that had never run anywhere. They are not decoration: the route
    # table guard in harness.spec.ts was FAILING on main when it was first run
    # by hand, and had been since the in-app PR review landed, because the only
    # frontend gate was a pre-commit hook that does not invoke playwright.
    #
    # Same gate and reason as `frontend` — a fork's token cannot read @wolffm/*.
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
               github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@wolffm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate

      # playwright.config.ts starts the real Flask backend as a webServer and
      # resolves its interpreter at <repo>/.venv/bin/python, falling back to a
      # bare `python3` that has none of these deps. Build the venv it expects
      # rather than relying on that fallback.
      - name: Create the backend venv the e2e webServer runs from
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements.txt

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Only chromium — the `local` project is Desktop Chrome and nothing else.
      - name: Install the browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      # NOT `pnpm test`: that goes through `pw-isolated`, a machine-local wrapper
      # in the operator's ~/.local/bin that forces software GL to keep Chromium
      # off a desktop NVIDIA GPU. No such GPU and no such wrapper here.
      #
      # CI=true is set by Actions, which is load-bearing in the config: it turns
      # off reuseExistingServer so this starts its own backend and vite rather
      # than adopting a stray one, and pins workers to 1.
      - name: Run the local e2e project
        working-directory: frontend
        run: pnpm exec playwright test --project=local

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  backend-fork:
    name: backend pytest (fork)
    # The signal for pull requests from an UNAUTHORIZED author, which the
    # self-hosted `backend` job deliberately refuses to run. Kept exactly
    # inverse to that job's condition so the two can never both fire, and never
    # both skip. GitHub-hosted, zero secrets, so
    # untrusted code never touches the production host or a live credential.
    # One test is deselected: test_score_integration_real_cli is the only
    # unmocked coverage of the LLM judge and needs CLAUDE_CODE_OAUTH_TOKEN,
    # which a fork PR has no way to obtain — the rest of the suite is fully
    # mocked and runs green here. A maintainer who wants the full gate re-pushes
    # the branch inside this repo, where the `backend` job runs it.
    if: >-
      github.event_name == 'pull_request' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
                github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r backend/requirements.txt \
            -r backend/requirements-dev.txt
      - name: Run tests (mocked subset)
        working-directory: backend
        run: python -m pytest tests/ -q --deselect tests/temporal/test_judge.py::test_score_integration_real_cli
