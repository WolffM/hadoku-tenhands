name: Publish Package

on:
  push:
    branches:
      - main  # Trigger on every push to main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, hadoku-builder]
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '${{ vars.NPM_SCOPE || ''@wolffm'' }}'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Note: actions/setup-node with registry-url automatically creates .npmrc
      # Use NODE_AUTH_TOKEN env var for authentication (no manual .npmrc needed)

      # pnpm via corepack, pinned by the `packageManager` field in package.json.
      # Replaces pnpm/action-setup, whose self-installer shares one directory
      # across every runner instance on the host and dies with
      # `ENOENT ... uv_cwd` when concurrent jobs race it.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm --version

      - name: Install dependencies
        working-directory: frontend
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      - name: Runtime deps must clear hadoku_site's supply-chain cooldown
        # A PUBLISH THAT SUCCEEDS IS NOT A PUBLISH THE PARENT CAN TAKE.
        #
        # hadoku_site enforces `minimumReleaseAge: 10080` — 7 days. tenhands
        # enforces none: frontend/pnpm-workspace.yaml has a
        # `minimumReleaseAgeExclude` list and no `minimumReleaseAge`, and an
        # exclusion without a window is inert. So this repo can adopt a
        # dependency published hours ago, publish happily, and leave the parent
        # unable to install the result for a week.
        #
        # On 2026-08-06 that is exactly what happened: dompurify@3.4.13 (4 days
        # old) and marked@18.0.9 (3 days old) shipped, hadoku_site's Update
        # Packages run died with ERR_PNPM_NO_MATURE_MATCHING_VERSION, and the
        # site kept serving the PREVIOUS bundle while the same push had already
        # redeployed the backend — a stale client against a changed API.
        #
        # Only `dependencies` are checked. Consumers resolve those and nothing
        # else, so devDependencies may be as new as they like; a blanket cooldown
        # here would force rolling back ~20 dev packages for no downstream gain.
        #
        # The floor of each range is what matters: a cooldown-enforcing consumer
        # picks the newest MATURE version within the range, so the range's
        # minimum has to be old enough to exist as an option at all.
        working-directory: frontend
        run: |
          node -e '
            const { execSync } = require("child_process");
            const deps = require("./package.json").dependencies || {};
            const WINDOW_DAYS = 7;
            const cutoff = Date.now() - WINDOW_DAYS * 864e5;
            const bad = [];
            for (const [name, range] of Object.entries(deps)) {
              if (name.startsWith("@wolffm/")) continue;  // excluded by policy
              const floor = range.replace(/^[\^~>=<\s]*/, "");
              // Fetch the WHOLE time map and index it in JS. `npm view pkg
              // time.3.4.13` looks like it should work and does not — npm treats
              // the dots as a field path, walks time -> 3 -> 4 -> 13, finds
              // nothing and prints nothing. That returns null, which read as
              // "no data, skip" and made this gate pass on the exact versions it
              // exists to reject. Verified against them both ways.
              let times;
              try {
                times = JSON.parse(
                  execSync(`npm view ${name} time --json`, {stdio:["ignore","pipe","ignore"]})
                    .toString().trim() || "null"
                );
              } catch {
                bad.push(`${name}: could not read publish times from the registry`);
                continue;
              }
              const published = times && times[floor];
              if (!published) {
                // A range floor with no matching published version is a typo or a
                // yanked release. Either way it is not something to wave through.
                bad.push(`${name}@${floor} is not a published version`);
                continue;
              }
              const age = (Date.now() - Date.parse(published)) / 864e5;
              if (Date.parse(published) > cutoff) {
                bad.push(`${name}@${floor} published ${published} (${age.toFixed(1)} days ago)`);
              }
            }
            if (bad.length) {
              console.error("::error::These runtime dependencies are younger than hadoku_site’s " +
                WINDOW_DAYS + "-day cooldown, so the parent will NOT be able to install this package:");
              for (const b of bad) console.error("  " + b);
              console.error("Pin each to the newest release older than " + WINDOW_DAYS + " days.");
              process.exit(1);
            }
            console.log("runtime dependencies all clear the parent’s " + WINDOW_DAYS + "-day cooldown");
          '

      - name: Build package
        working-directory: frontend
        run: pnpm run build

      - name: Check if package changed
        id: package_changed
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Package has changes"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✗ No changes in package"
          fi

      - name: Check and bump version if needed
        if: steps.package_changed.outputs.changed == 'true'
        working-directory: frontend
        run: |
          # Get package name and current version from package.json
          # Note: The pre-commit hook may have already bumped the version in this commit
          package_name=$(node -p "require('./package.json').name")
          current_version=$(node -p "require('./package.json').version")
          
          echo "Current version in package.json: $current_version"

          # START FROM THE REGISTRY, NOT FROM package.json.
          #
          # The bump below is written into the runner's workspace and published,
          # but never committed back to main. So package.json on main is frozen
          # at whatever it was when this workflow was written, while the
          # registry marches on — and every run used to re-walk the entire gap
          # one patch at a time, from scratch, before it could publish anything.
          #
          # That is not theoretical: on 2026-08-05 main said 1.14.5 and the
          # registry was past 1.18.20. Walking 1.14.5 → 1.14.20 (15 steps) then
          # 21 steps per minor across 1.15–1.18 is 99 attempts, and the run died
          # on attempt 99 having published nothing. The loop was not retrying,
          # it was counting to a hundred.
          #
          # Asking the registry for `latest` makes the walk start where reality
          # is, so it takes one step instead of a hundred, and it cannot drift
          # again no matter how far behind the committed version falls.
          latest_published=$(pnpm view "${package_name}" version 2>/dev/null || echo "")
          if [ -n "$latest_published" ]; then
            echo "Latest published in registry:    $latest_published"
            # Whichever is higher wins. Usually the registry — but if a
            # pre-commit hook already bumped past it, that newer version is
            # the right starting point and must not be dragged backwards.
            check_version=$(printf '%s\n%s\n' "$current_version" "$latest_published" \
                              | sort -V | tail -1)
          else
            # Never published, or the registry is unreachable. Fall back to the
            # old behaviour rather than guessing — the loop below still checks
            # each candidate, so the worst case is the slow path, not a wrong
            # version.
            echo "No published version found; starting from package.json"
            check_version="$current_version"
          fi
          echo "Starting version check at:       $check_version"
          check_version_start="$check_version"

          # Now genuinely a retry, not a catch-up: from the true latest the
          # first candidate is almost always free. A cap of 10 leaves room for
          # a real race — two publishes in flight at once — while still failing
          # fast and loudly if something is actually wrong with the registry or
          # this logic.
          max_attempts=10
          attempt=0
          while pnpm view "${package_name}@${check_version}" version 2>/dev/null; do
            attempt=$((attempt + 1))
            if [ $attempt -ge $max_attempts ]; then
              echo "❌ Error: Exceeded maximum version bump attempts ($max_attempts)."
              echo "   Started at $check_version_start (package.json: $current_version,"
              echo "   registry latest: ${latest_published:-<could not read>})."
              echo "   With the starting point taken from the registry this should"
              echo "   take one step, so $max_attempts consecutive collisions means"
              echo "   something real is wrong — most likely the registry lookup"
              echo "   failed and this fell back to the stale committed version."
              exit 1
            fi
            echo "⚠️  Version $check_version already published, bumping version... (attempt $attempt/$max_attempts)"
            
            # Parse version
            major=$(echo $check_version | cut -d. -f1)
            minor=$(echo $check_version | cut -d. -f2)
            patch=$(echo $check_version | cut -d. -f3)
            
            # Rollover at .20 to keep patch numbers manageable (matching pre-commit hook)
            if [ $patch -ge 20 ]; then
              new_minor=$((minor + 1))
              check_version="$major.$new_minor.0"
              echo "🚀 Rolling over to minor version: $check_version"
            else
              new_patch=$((patch + 1))
              check_version="$major.$minor.$new_patch"
              echo "📈 Incrementing patch version: $check_version"
            fi
          done
          
          # If we had to bump the version, update package.json
          if [ "$check_version" != "$current_version" ]; then
            echo "✅ Version needs to be bumped: $current_version → $check_version"
            
            # Update package.json with new version
            node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');" "$check_version"
            
            # Update lock file
            pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --lockfile-only
          else
            echo "✓ Version $current_version is not published yet, ready to publish"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      - name: Publish package
        if: steps.package_changed.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}

      # Notify parent app to update dependencies
      - name: Notify parent about package update
        if: steps.package_changed.outputs.changed == 'true'
        env:
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          echo "Notifying hadoku_site about package update..."

          if [ -z "$HADOKU_SITE_TOKEN" ]; then
            echo "⚠️  Warning: HADOKU_SITE_TOKEN not available, skipping notification"
            exit 0
          fi

          payload=$(cat <<EOF
            {
              "event_type": "packages_updated",
              "client_payload": {
                "packages": ["${{ vars.NPM_SCOPE || '@wolffm' }}/tenhands"],
                "sha": "${{ github.sha }}",
                "ref": "${{ github.ref }}"
              }
            }
          EOF
          )

          status_code=$(curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST "https://api.github.com/repos/${{ vars.DEPLOY_TARGET_REPO || 'WolffM/hadoku_site' }}/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $HADOKU_SITE_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d "$payload")

          if [ "$status_code" = "204" ]; then
            echo "✅ Notified hadoku_site about package update"
          else
            echo "⚠️  Failed to notify hadoku_site (HTTP $status_code)"
          fi

      - name: Report the outcome so a silent failure can't hide
        # Nothing polls this repo's workflows — monitoring-api's ci-check list
        # covers hadoku_site and watchparty only — so a red run here is seen by
        # exactly nobody unless it says so itself. A publish that fails leaves
        # the site serving the previous UI bundle, with no sign it is stale.
        #
        # `POST /health/api/jobs` is the fleet's one alerting path: monitoring-api
        # turns the outcome into a Discord alert AND into the `crons` domain of
        # `GET /health/api/sitrep`, so this repo goes red where the operator
        # already looks. Routing is hadoku_site's business; ours is to be honest
        # about our own state. Full rationale in taskauto.yml.
        if: always()
        env:
          HADOKU_SERVICE_KEY: ${{ secrets.KEY_SERVICE_TENHANDS }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          case "$OUTCOME" in
            success) status=succeeded ;;
            failure) status=failed ;;
            *) echo "outcome=$OUTCOME — not reported"; exit 0 ;;
          esac

          started=${JOB_STARTED_AT:-}
          if [ -n "$started" ]; then
            duration_ms=$(( ($(date -u +%s) - started) * 1000 ))
          else
            duration_ms=0
          fi

          jq -n --arg st "$status" --arg run "gha_$RUN_ID" \
                --arg err "tenhands:publish failed — $RUN_URL" \
                --argjson d "$duration_ms" \
            '{job_name: "tenhands:publish", status: $st, run_id: $run, duration_ms: $d}
             + (if $st == "failed" then {error: $err} else {} end)' > /tmp/tenhands-publish-outcome.json

          # A monitoring blip must never turn a healthy run red.
          curl -sS -f -X POST https://hadoku.me/health/api/jobs \
            -H "X-User-Key: $HADOKU_SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            --data @/tmp/tenhands-publish-outcome.json \
            || echo "::warning::could not report outcome to monitoring-api"
