name: Publish Package

on:
  push:
    branches:
      - main  # Trigger on every push to main
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  packages: write
  # The job's own token dispatches deploy.yml once the publish has landed.
  # A workflow_dispatch sent with GITHUB_TOKEN still starts a run — it is one
  # of the two events exempt from GitHub's no-recursion rule.
  actions: write

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '${{ vars.NPM_SCOPE || ''@wolffm'' }}'
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Note: actions/setup-node with registry-url automatically creates .npmrc
      # Use NODE_AUTH_TOKEN env var for authentication (no manual .npmrc needed)

      # pnpm via corepack, pinned by the `packageManager` field in package.json.
      # Replaces pnpm/action-setup, whose self-installer shares one directory
      # across every runner instance on the host and dies with
      # `ENOENT ... uv_cwd` when concurrent jobs race it.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.0 --activate
          pnpm --version

      - name: Registry token from the vault
        uses: WolffM/hadoku-actions/vault-fetch@v1
        with:
          keys: HADOKU_NPM_READ_TOKEN
        env:
          HADOKU_VAULT_KEY: ${{ secrets.KEY_SERVICE_TENHANDS }}
          VAULT_FALLBACK_HADOKU_NPM_READ_TOKEN: ${{ secrets.HADOKU_NPM_READ_TOKEN }}

      - name: Install dependencies
        working-directory: frontend
        run: pnpm --config.store-dir=${{ runner.tool_cache }}/pnpm-store install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ env.HADOKU_NPM_READ_TOKEN }}

      - name: Runtime deps must clear hadoku_site's supply-chain cooldown
        # A PUBLISH THAT SUCCEEDS IS NOT A PUBLISH THE PARENT CAN TAKE.
        #
        # hadoku_site enforces `minimumReleaseAge: 10080` — 7 days. tenhands
        # enforces none: frontend/pnpm-workspace.yaml has a
        # `minimumReleaseAgeExclude` list and no `minimumReleaseAge`, and an
        # exclusion without a window is inert. So this repo can adopt a
        # dependency published hours ago, publish happily, and leave the parent
        # unable to install the result for a week.
        #
        # On 2026-08-06 that is exactly what happened: dompurify@3.4.13 (4 days
        # old) and marked@18.0.9 (3 days old) shipped, hadoku_site's Update
        # Packages run died with ERR_PNPM_NO_MATURE_MATCHING_VERSION, and the
        # site kept serving the PREVIOUS bundle while the same push had already
        # redeployed the backend — a stale client against a changed API.
        #
        # Only `dependencies` are checked. Consumers resolve those and nothing
        # else, so devDependencies may be as new as they like; a blanket cooldown
        # here would force rolling back ~20 dev packages for no downstream gain.
        #
        # The floor of each range is what matters: a cooldown-enforcing consumer
        # picks the newest MATURE version within the range, so the range's
        # minimum has to be old enough to exist as an option at all.
        working-directory: frontend
        run: |
          node -e '
            const { execSync } = require("child_process");
            const deps = require("./package.json").dependencies || {};
            const WINDOW_DAYS = 7;
            const cutoff = Date.now() - WINDOW_DAYS * 864e5;
            const bad = [];
            for (const [name, range] of Object.entries(deps)) {
              if (name.startsWith("@wolffm/")) continue;  // excluded by policy
              const floor = range.replace(/^[\^~>=<\s]*/, "");
              // Fetch the WHOLE time map and index it in JS. `npm view pkg
              // time.3.4.13` looks like it should work and does not — npm treats
              // the dots as a field path, walks time -> 3 -> 4 -> 13, finds
              // nothing and prints nothing. That returns null, which read as
              // "no data, skip" and made this gate pass on the exact versions it
              // exists to reject. Verified against them both ways.
              let times;
              try {
                times = JSON.parse(
                  execSync(`npm view ${name} time --json`, {stdio:["ignore","pipe","ignore"]})
                    .toString().trim() || "null"
                );
              } catch {
                bad.push(`${name}: could not read publish times from the registry`);
                continue;
              }
              const published = times && times[floor];
              if (!published) {
                // A range floor with no matching published version is a typo or a
                // yanked release. Either way it is not something to wave through.
                bad.push(`${name}@${floor} is not a published version`);
                continue;
              }
              const age = (Date.now() - Date.parse(published)) / 864e5;
              if (Date.parse(published) > cutoff) {
                bad.push(`${name}@${floor} published ${published} (${age.toFixed(1)} days ago)`);
              }
            }
            if (bad.length) {
              console.error("::error::These runtime dependencies are younger than hadoku_site’s " +
                WINDOW_DAYS + "-day cooldown, so the parent will NOT be able to install this package:");
              for (const b of bad) console.error("  " + b);
              console.error("Pin each to the newest release older than " + WINDOW_DAYS + " days.");
              process.exit(1);
            }
            console.log("runtime dependencies all clear the parent’s " + WINDOW_DAYS + "-day cooldown");
          '

      # What this PUSH introduced, as a diff range.
      #
      # `HEAD~1 HEAD` is the last COMMIT, and a push is not one commit. Push
      # three commits where the source changes in the first and a chore lands
      # last, and the publish is silently skipped — a green run that shipped
      # nothing, because the gate, the Version step and the dispatch below all
      # read the same wrong answer and therefore agree with each other.
      #
      # `github.event.before` is the tip before the push, the only base that
      # covers every commit in it. hadoku-meet hit this on 2026-08-18 and
      # hadoku-hopper on 2026-09-01, where a two-commit push stranded
      # @wolffm/hopper-worker 0.1.8 and the site ran a new client against a
      # month-old worker. hadoku_site's check:repo-policy has held every fleet
      # publish workflow to this since 2026-09-02.
      - name: Resolve the range this push introduced
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # A manual dispatch is an explicit "publish now". It exists to recover
          # a publish that was skipped, so the change check must never veto it:
          # diffing HEAD~1 here would skip the same thing the stranded push
          # skipped, and the only way out would be a no-op commit.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual dispatch: publishing unconditionally"
            echo "publish_all=true" >> $GITHUB_OUTPUT
            echo "base=HEAD~1" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "publish_all=false" >> $GITHUB_OUTPUT

          base="$BEFORE"
          # A branch's first push sends the all-zero sha; a force-push can name
          # a commit that is no longer reachable. Fall back to the last commit
          # in both cases — a narrower range than the truth, but never a broken
          # one.
          if [ -z "$base" ] \
            || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "No usable push base ('$base'); falling back to HEAD~1"
            base="HEAD~1"
          fi
          echo "base=$base" >> $GITHUB_OUTPUT
          echo "Comparing ${base}..HEAD:"
          git diff --name-only "$base" HEAD

      - name: Check if package changed
        id: package_changed
        env:
          BASE: ${{ steps.range.outputs.base }}
          PUBLISH_ALL: ${{ steps.range.outputs.publish_all }}
        run: |
          if [ "$PUBLISH_ALL" = "true" ] || git diff --name-only "$BASE" HEAD | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "✓ Package has changes"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "✗ No changes in package"
          fi

      # The version is CI's, never a commit's (operator, 2026-11-01): one patch
      # above the registry's newest, written to frontend/package.json in this
      # workspace only and never committed back. A committed version above the
      # registry is kept, so a deliberate minor/major bump still works. An
      # unreadable registry FAILS here rather than guess — the old walk fell
      # back to the stale committed version and died at attempt 99 (2026-08-05).
      - name: Version
        id: version
        if: steps.package_changed.outputs.changed == 'true'
        uses: WolffM/hadoku-actions/next-version@v1
        with:
          package-dir: frontend
        env:
          NODE_AUTH_TOKEN: ${{ env.HADOKU_NPM_READ_TOKEN }}

      - name: Build package
        if: steps.package_changed.outputs.changed == 'true'
        working-directory: frontend
        run: pnpm run build

      # `published` is true only when the registry's newest version was
      # published by this very commit: a re-run, so skip to the notify and
      # redeploy it exists to retry.
      - name: Publish package
        if: steps.package_changed.outputs.changed == 'true' && steps.version.outputs.published != 'true'
        working-directory: frontend
        run: pnpm publish --no-git-checks
        env:
          # The repo-local GITHUB_TOKEN (permissions: packages: write above)
          # publishes this repo's OWN package — no PAT. Installs and the
          # Version step use HADOKU_NPM_READ_TOKEN from the vault: cross-repo
          # @wolffm package READS are outside GITHUB_TOKEN's repo-local grant.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # hadoku_site is told through mgmt-api with this repo's own service key
      # (hadoku-actions/repo-action), so this repo holds no token that can
      # write to hadoku_site. A refused or unanswered notify FAILS this job:
      # the old dispatch only warned, and a dropped dispatch means a release
      # that never reaches the site. Failing here also holds the backend
      # redeploy below, which is the ordering this workflow exists to keep.
      # The scope is literal: mgmt-api accepts only @wolffm/* package names.
      - name: Notify hadoku_site (packages_updated)
        if: steps.package_changed.outputs.changed == 'true'
        uses: WolffM/hadoku-actions/repo-action@v1
        with:
          verb: notify
          body: '{"event_type":"packages_updated","client_payload":{"packages":["@wolffm/tenhands"],"sha":"${{ github.sha }}"}}'
          service-key: ${{ secrets.KEY_SERVICE_TENHANDS }}

      - name: Redeploy the backend, now that the frontend has shipped
        # THE ORDERING THIS EXISTS TO ENFORCE. deploy.yml used to run `on: push`,
        # so it raced this workflow on every commit and always won — publishing
        # has to build, resolve a version and upload before it can finish.
        #
        # That race is what stranded production on 2026-08-06: a dependency bump
        # left @wolffm/tenhands uninstallable by hadoku_site (its 7-day
        # supply-chain cooldown rejected two deps), this workflow failed, and the
        # backend redeployed anyway. The new API served the previously-published
        # bundle until someone noticed.
        #
        # Dispatching from here means the backend cannot ship a contract the
        # frontend failed to ship against: if anything above fails — the cooldown
        # gate, the build, the publish — this step never runs.
        #
        # NOT gated on `package_changed`. A commit that touches only the Python
        # backend still needs the pm2 services restarted, and that path must not
        # depend on whether the npm package happened to change.
        #
        # If this step is ever removed, put deploy.yml back on `on: push` or the
        # backend stops deploying entirely, silently.
        #
        # Sent with the job's own token (`actions: write` above): dispatching a
        # workflow in THIS repo needs nothing broader.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status_code=$(curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"${{ github.ref_name }}"}')

          # Fail the run on a failed dispatch. The alternative is a green publish
          # whose backend never deployed — main looks shipped, prod is not, and
          # nothing says so.
          if [ "$status_code" = "204" ]; then
            echo "✅ backend redeploy requested (Deploy to PM2)"
          else
            echo "::error::could not trigger Deploy to PM2 (HTTP $status_code) —" \
                 "the backend is still on the previous commit."
            exit 1
          fi

      - name: Report the outcome so a silent failure can't hide
        # Why a job reports at all, and why this is referenced rather than
        # vendored, are both in WolffM/hadoku-actions.
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: tenhands:publish
          service-key: ${{ secrets.KEY_SERVICE_TENHANDS }}
          started-at: ${{ env.JOB_STARTED_AT }}
