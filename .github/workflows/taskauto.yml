name: Task automation

# The hadoku-task-automation pipeline as an ephemeral job instead of a daemon.
#
# It used to be an always-on pm2 service. That made it a long-lived credential
# holder sitting on the same host as the services it can break, and it had to
# poll to find work. This shape holds its credentials only for the length of a
# run, gets a clean checkout by construction, and costs nothing when idle.
#
# TWO TRIGGERS, DOING DIFFERENT JOBS.
#
# `repository_dispatch` is the fast path. hadoku-task fires it on ANY human
# write to a task on an automation board — including a brand-new capture into
# the Inbox — the spec is docs/hadoku-task-automation/ask-dispatch-on-lane-change.md.
# Its payload is logged and otherwise ignored: the run does its normal board
# sweep, so the dispatch carries no authority. It says "look now", never "do
# this". That is what makes an untrusted, duplicated or malformed payload
# harmless.
#
# It used to fire only on a write into a `user` lane, and a fresh capture was
# deliberately excluded to protect the settle window. That made creating a task
# — the single most common thing a person does here — the ONE action with no
# fast path, so it fell through to a cron that is not a cron (below) and sat
# for a median 45 minutes. The settle window is now honoured by waiting a
# minute inside the run instead of by declining to start one.
#
# The cron is the backstop, and it is not redundant. Crash recovery fires on
# *lease expiry* — the absence of a heartbeat, which nothing can push. It also
# covers dispatches lost while these services restart mid-deploy: the act of
# working creates those gaps, and a missed push means a task sits forever with
# nobody noticing. Silence is the worst failure mode this system has.
#
# An idle run is one board-API call and an exit, so the cron is cheap.

on:
  schedule:
    # NOT the real backstop, and do not treat it as one. GitHub deprioritises
    # `schedule` and drops most ticks: measured across 73 consecutive delivered
    # runs on this workflow, the SHORTEST gap was 24 minutes, the mean ~45 and
    # the max 86. Not one gap under 24 min in 73 samples. Tightening the
    # expression cannot fix that — the throttle is on delivery, not on the
    # expression — so `*/15` here is aspirational, not a guarantee.
    #
    # The real 15-minute backstop is a HOST cron on the self-hosted runner box
    # (`scripts/taskauto-cron.sh`, installed in hokon's crontab), which fires
    # `gh workflow run` on a timer we own and GitHub does not get a vote on.
    # See that script's header for why this one stays anyway.
    - cron: '*/15 * * * *'
  repository_dispatch:
    # Must equal the `event_type` the worker sends. Note repository_dispatch
    # only triggers a workflow present on the DEFAULT branch — the usual reason
    # a first end-to-end test looks like a silent no-op.
    #
    # THIS WORKFLOW EXISTS ONLY HERE, and that is what makes the wake signal's
    # destination load-bearing. This one job sweeps EVERY board, so a task on
    # the pygmalion board must dispatch to `WolffM/tenhands` — not to
    # `WolffM/hadoku-pygmalion`, which has nothing listening. It did exactly
    # that for three days: GitHub accepts a dispatch for a repo with no matching
    # workflow and drops it without an error, so six of seven boards had a fast
    # path that was dead and looked healthy. hadoku-task aims it with
    # `AUTOMATION_RUNNER_REPO` (task-api's wrangler.toml). If a fresh capture
    # stops waking a run, check that binding before anything in this file.
    types: [taskauto]
  workflow_dispatch:
    inputs:
      live:
        description: 'Actually push branches and open PRs (unchecked = dry run)'
        type: boolean
        default: true
      mode:
        description: 'pr = open a pull request; push = merge to main unattended'
        type: choice
        options: [pr, push]
        default: pr

# Never two runs at once: the board's claim protocol is per-task, but two
# concurrent runs would fight over the same checkout. `cancel-in-progress:
# false` because cancelling a run mid-agent would leave a claim held until its
# lease expires — queueing behind it is strictly better.
#
# This only binds runs GitHub knows about. A manual `run_taskauto.py` on the
# same host shares ~/.taskauto/repos and is invisible here, so the checkout
# itself is flocked as well — `CheckoutManager.lock`.
concurrency:
  group: taskauto
  cancel-in-progress: false

jobs:
  run:
    name: drain the board
    runs-on: [self-hosted, pm2-host, taskauto]
    timeout-minutes: 45

    env:
      # Automated runs — cron AND dispatch — are live in `pr` mode on purpose.
      # Opening a pull request cannot hurt `main` (a human still merges), so the
      # thing worth automating is everything up to that button.
      #
      # Phrased as "not the manual trigger" rather than listing the automated
      # ones. The old form tested `event_name == 'schedule'`, which meant adding
      # repository_dispatch silently made every pushed run a DRY RUN: `inputs`
      # is null outside workflow_dispatch, so the whole condition went false and
      # the run would verify and then refuse to push, with nothing in the log
      # saying why. Any future trigger is live by default here, which is the
      # safer direction to be wrong in — a dry run that looks like a success is
      # worse than a PR nobody asked for.
      TASKAUTO_LIVE: ${{ (github.event_name != 'workflow_dispatch' || inputs.live) && '1' || '0' }}
      TASKAUTO_MODE: ${{ inputs.mode || 'pr' }}
      TASKAUTO_ONCE: '1'
      # The `tenhands-service-key` identity — the one board shares are
      # granted to. A valid key for any other identity authenticates fine
      # and then sees zero boards, which reads like a sharing problem.
      #
      # The secret NAME must match the vault item name: hadoku_site provisions
      # GitHub secrets by pulling the vault item of the same name, so a name
      # with no vault item behind it can never be refreshed by anything.
      HADOKU_SERVICE_KEY: ${{ secrets.KEY_SERVICE_TENHANDS }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # A PAT, deliberately NOT the automatic GITHUB_TOKEN: pull requests
      # opened with GITHUB_TOKEN do not trigger `pull_request` workflows, so
      # every PR this job opened would sit with no checks at all — the exact
      # "green because nothing ran" failure the test workflow exists to stop.
      GH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
      # claude and gh live in ~/.local/bin, which is not on the runner's PATH.
      TASKAUTO_CLAUDE_BIN: /home/hadoku/.local/bin/claude

    steps:
      - name: Report the PREVIOUS run, because a dead run cannot report itself
        # THE HOLE THIS CLOSES. On 2026-08-04 the self-hosted runner lost its
        # connection to GitHub mid-job — `BrokerServer SocketException (125)`,
        # then `renewjob` 404, then "Runner will be shutdown for UserCancelled".
        # The job went red and told NOBODY, because the reporting step at the
        # bottom of this file is `if: always()` and `always()` cannot save a
        # step on a runner that no longer exists. Nothing executes after the
        # process dies. No in-run condition can ever cover that.
        #
        # So the observer has to be OUTSIDE the run, and the cheapest correct
        # observer is the NEXT run: the host cron guarantees one every 15
        # minutes, it already holds the credential, and it is a different
        # process on a different lease. Each run judges exactly its immediate
        # predecessor, so every run is judged exactly once and no state file is
        # needed to dedupe.
        #
        # FIRST step on purpose. Whatever kills this job later, this has
        # already spoken for the run before it.
        #
        # Reports ANY non-success conclusion, not just `cancelled`. A genuine
        # failure self-reports too, so that double-reports — deliberately.
        # `run_id` is `gha_<previous id>`, the same key the self-report uses,
        # and POST /health/api/jobs UPSERTS on run_id: the second write updates
        # the same row instead of inventing a second failure. Alert-wise the
        # duplicate is absorbed by the 24h reminder throttle. Being told twice
        # is free; being told never is what cost us a red run.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
          THIS_RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"   # gh is not on the runner PATH

          # The most recent COMPLETED run that is not this one. `--limit 10`
          # rather than 1: this run, and any still-queued sibling, are in the
          # list and must be skipped over.
          prev=$(gh run list --workflow=taskauto.yml --repo "$REPO" --limit 10 \
                   --json databaseId,status,conclusion \
                   --jq "[.[] | select(.status == \"completed\")
                              | select(.databaseId != ${THIS_RUN})] | first" 2>/dev/null || echo "")

          if [ -z "$prev" ] || [ "$prev" = "null" ]; then
            echo "no completed predecessor to report on"
            exit 0
          fi

          prev_id=$(echo "$prev"   | jq -r '.databaseId')
          prev_concl=$(echo "$prev" | jq -r '.conclusion // "unknown"')
          echo "previous run $prev_id concluded: $prev_concl"

          if [ "$prev_concl" = "success" ]; then
            exit 0
          fi

          # A non-success conclusion is several completely different events
          # wearing one word, and only some of them are worth waking anyone for.
          #
          # `concurrency: {group: taskauto, cancel-in-progress: false}` keeps at
          # most ONE run pending per group. When a third dispatch arrives while
          # one is running and one is already waiting, GitHub cancels the waiter
          # to make room for the newcomer. Nothing started, nothing was claimed,
          # no work was lost — the run that replaced it performs the same board
          # sweep. A burst of board updates produces these constantly, and every
          # one of them used to `@here` the channel.
          #
          # The other case is the one this whole step exists for: 2026-08-04,
          # the runner died mid-job and reported nothing.
          #
          # THE DISCRIMINATOR IS WHETHER THE WORK EVER REACHED A RUNNER, and it
          # is deliberately NOT the run-level conclusion, which lies about this.
          #
          # This used to test `total_count == 0` under an `if cancelled` gate,
          # on the theory that a run GitHub never dispatched has no job row at
          # all. That is true of a superseded waiter and false of everything
          # else that never ran. During the 2026-08-06 Actions incident
          # (githubstatus: critical, Actions+Pages, 15:22Z onward) GitHub
          # accepted five taskauto runs, created a job row for each, and then
          # could not hand any of them to a runner — "The job was not acquired
          # by Runner of type self-hosted even after multiple attempts". Those
          # surface as `total_count: 1`, run-level conclusion `failure`, so they
          # missed the `cancelled` gate AND the `== 0` test, and paged @here for
          # an outage on GitHub's side of the wire that we could not act on.
          #
          # Measured 2026-08-06 on the three shapes:
          #   never dispatched  31126318586 → runner_name "",             steps 0
          #   died mid-job      31120917042 → runner_name "hokon-tenhands", steps 11
          #   healthy           31126553517 → runner_name "hokon-tenhands", steps 11
          # so "no runner claimed it AND no step ran" separates the case where
          # nothing of ours executed from the case where our job ran and died.
          # A superseded waiter has an empty `.jobs` array and lands here too,
          # which is why this replaces the old test rather than joining it.
          #
          # NOT extended to "the self-hosted runner lost communication". That is
          # the 2026-08-04 signature, where OUR job took the host down — a
          # runner claimed it and steps ran, so it stays loud on purpose.
          #
          # Reported as `skipped`, not dropped. `skipped` is inert to the alert
          # state by design — it neither pages nor clears a live failure streak —
          # so this buys silence on GitHub's outages without going dark: if the
          # board stops draining for six hours the ledger still shows the runs
          # arriving and being turned away, which is the trail you need to tell
          # "GitHub is down" apart from "the cron died".
          #
          # Fails toward alerting: ONLY an exact "0" suppresses. An API error, a
          # 404 body, an empty string or anything unparseable falls through and
          # reports. Being told twice is free; being told never is what this
          # cost us on 2026-08-04.
          prev_started=$(gh api "repos/${REPO}/actions/runs/${prev_id}/jobs" \
                           --jq '[.jobs[]
                                  | select((.runner_name // "") != ""
                                           or ((.steps // []) | length) > 0)]
                                 | length' 2>/dev/null)
          if [ "$prev_started" = "0" ]; then
            echo "run $prev_id never reached a runner (no job claimed it, no" \
                 "step ran) — superseded in the concurrency queue, or GitHub" \
                 "could not dispatch it. Not our failure; recording it as skipped."
            jq -n --arg run "gha_${prev_id}" \
              '{job_name: "tenhands:taskauto", status: "skipped", run_id: $run,
                duration_ms: 0}' > /tmp/taskauto-prev.json
            curl -sS -f -X POST https://hadoku.me/health/api/jobs \
              -H "X-User-Key: $HADOKU_SERVICE_KEY" \
              -H 'Content-Type: application/json' \
              --data @/tmp/taskauto-prev.json \
              && echo "recorded $prev_id as skipped" \
              || echo "::warning::could not record the previous run as skipped"
            exit 0
          fi
          # Anything that is not a plain integer is an error body, not a count —
          # say so rather than pasting a 404 blob into the middle of a sentence.
          case "$prev_started" in
            ''|*[!0-9]*) prev_started='<unreadable>' ;;
          esac
          echo "run $prev_id reached a runner ($prev_started job(s) claimed or" \
               "started) — a real failure, reporting it."

          # `killed` rather than `failed` for a cancellation: the fleet's job
          # vocabulary has a state for "something stopped this from outside",
          # and it is the honest one. Both are in FAILING_STATES, so either
          # way it alerts.
          case "$prev_concl" in
            cancelled) status=killed ;;
            *)         status=failed ;;
          esac

          jq -n --arg st "$status" --arg run "gha_${prev_id}" \
                --arg err "taskauto run $prev_id ended '$prev_concl' — ${SERVER}/${REPO}/actions/runs/${prev_id}" \
            '{job_name: "tenhands:taskauto", status: $st, run_id: $run,
              duration_ms: 0, error: $err}' > /tmp/taskauto-prev.json

          # Never fail THIS run over reporting the last one.
          curl -sS -f -X POST https://hadoku.me/health/api/jobs \
            -H "X-User-Key: $HADOKU_SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            --data @/tmp/taskauto-prev.json \
            && echo "reported $prev_id as $status" \
            || echo "::warning::could not report the previous run's outcome"

      - name: Say what woke this run
        # Tracing only. When a board goes quiet the first question is always
        # "did anything even try", and a cron tick and a pushed wake-up fail in
        # different places — the log has to distinguish them before the sweep
        # starts, not after.
        #
        # The payload goes through `env`, never interpolated into `run`. A
        # `${{ github.event.client_payload.* }}` inside a shell line is a script
        # injection: the values are authored by whoever can reach the worker,
        # and this job holds a PAT that can push to `main`.
        env:
          WOKE_BY: ${{ github.event_name }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          LIVE: ${{ (github.event_name != 'workflow_dispatch' || inputs.live) && '1' || '0' }}
          MODE: ${{ inputs.mode || 'pr' }}
        run: |
          printf 'trigger: %s (live=%s mode=%s)\n' "$WOKE_BY" "$LIVE" "$MODE"
          if [ "$WOKE_BY" = "repository_dispatch" ]; then
            # Logged, deliberately not acted on: the sweep below decides what is
            # actionable. The dispatch is a wake signal with no authority.
            printf 'client_payload (not trusted, not acted on): %s\n' "$PAYLOAD"
          fi

      - uses: actions/checkout@v6

      - name: Check the credentials are present
        # Fail here with a sentence rather than 20 minutes later inside an
        # agent log. A missing board key is the difference between "no work
        # found" and "could not look", and those must not look alike.
        run: |
          missing=
          [ -n "$HADOKU_SERVICE_KEY" ] || missing="$missing HADOKU_SERVICE_KEY"
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || missing="$missing CLAUDE_CODE_OAUTH_TOKEN"
          [ -n "$GH_TOKEN" ] || missing="$missing HADOKU_SITE_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secret(s):$missing"
            echo "Set them with: gh secret set <NAME> --repo WolffM/tenhands"
            exit 1
          fi
          echo "credentials present"

      - name: Set up the environment
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --quiet --upgrade pip
          .venv-ci/bin/python -m pip install --quiet -r backend/requirements.txt

      - name: Let a fresh capture settle
        # A dispatch means a human JUST wrote a task. Planning it this instant
        # would plan against a sentence still being typed, which is the whole
        # reason `selection.DEFAULT_SETTLE` exists — a task must sit untouched
        # for a minute before anyone plans it.
        #
        # So wait it out HERE, once, before the sweep. The alternative — sweep
        # immediately, find the task unsettled, sweep again — costs a wasted
        # board round-trip to learn something we already knew at wake time.
        # There is nothing to discover: we were told a capture just happened,
        # and a capture is exactly the thing that needs the minute.
        #
        # Keep this in step with DEFAULT_SETTLE. If they drift, the dispatch
        # path either plans too early (and the sweep no-ops, falling back to the
        # backstop cron) or waits longer than it has to.
        #
        # Only on the dispatch path. A cron sweep is finding tasks that have
        # been sitting there, so it has nothing to wait for.
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "woken by a fresh capture — waiting 60s for it to settle"
          sleep 60

      - name: Run the pipeline
        working-directory: backend
        run: |
          echo "TASKAUTO_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"
          ../.venv-ci/bin/python run_taskauto.py

      - name: Report the outcome so a broken sweep screams
        # This job ran red every 39 minutes for ten hours on 2026-07-30 and told
        # nobody: a credential rename left the Actions secret pointing at an
        # identity with no board shares, and a scheduled workflow that fails
        # silently is indistinguishable from one with nothing to do.
        #
        # `POST /health/api/jobs` is the fleet's one alerting path — monitoring-api
        # hooks the alert on the outcome itself (`services/job-alerts.ts`), so a
        # job gets Discord by reporting, with no webhook handed to a runner. Its
        # throttle is what makes this bearable: alert on the break, then at most
        # one reminder per 24h, then a recovery notice. Ten hours of failures is
        # one message, not fifteen.
        #
        # NOT `/health/api/telemetry` — that path writes the ledger and alerts
        # nobody, which is the same silence this step exists to end.
        #
        # `always()` so recoveries are reported too: without the success side,
        # the alert state stays broken and the next real failure is a suppressed
        # reminder rather than a new one.
        #
        # `always()` is NOT total, and it is worth knowing exactly where it
        # stops. It covers this job succeeding or failing. It does not cover
        # the runner process dying, because then there is nothing left to
        # evaluate a condition — the step is marked `skipped` and no alert
        # fires. That case is covered from outside, by the "Report the PREVIOUS
        # run" step at the top of this job, running in the NEXT run.
        if: always()
        env:
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          case "$OUTCOME" in
            success) status=succeeded ;;
            failure) status=failed ;;
            # A cancel is not evidence of breakage, and `skipped` is inert to the
            # alert state by design — it must not clear a live failure streak.
            *) echo "outcome=$OUTCOME — not reported"; exit 0 ;;
          esac

          started=${TASKAUTO_STARTED_AT:-}
          if [ -n "$started" ]; then
            duration_ms=$(( ($(date -u +%s) - started) * 1000 ))
          else
            # The run died before the pipeline started (checkout, venv, missing
            # credential). Still report it — that is exactly the outage class —
            # but do not invent a duration; the field is required, 0 is honest.
            duration_ms=0
          fi

          jq -n --arg st "$status" --arg run "gha_$RUN_ID" \
                --arg err "taskauto sweep failed — $RUN_URL" \
                --argjson d "$duration_ms" \
            '{job_name: "tenhands:taskauto", status: $st, run_id: $run, duration_ms: $d}
             + (if $st == "failed" then {error: $err} else {} end)' > /tmp/taskauto-outcome.json

          # Never fail the job on a reporting failure — a monitoring blip must not
          # turn a healthy sweep red. `-f` so a non-2xx is visible in the log.
          curl -sS -f -X POST https://hadoku.me/health/api/jobs \
            -H "X-User-Key: $HADOKU_SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            --data @/tmp/taskauto-outcome.json \
            || echo "::warning::could not report outcome to monitoring-api"
