name: Deploy to PM2

# NOT triggered by push. `Publish Package` dispatches this workflow as its last
# step, so the pm2 redeploy happens only after the frontend package has actually
# published.
#
# It used to be `on: push`, which meant this and publish.yml raced on every
# commit — and the backend always won, because publishing has to build, resolve
# a version and upload first. That is how 2026-08-06 went wrong: a dependency
# bump left @wolffm/tenhands uninstallable by hadoku_site, `Publish Package`
# failed, and this workflow cheerfully redeployed the backend anyway. Production
# ran the new API against the previously-published bundle until someone noticed.
#
# Chaining from inside the publish run, rather than via `workflow_run`, is
# deliberate. A `workflow_run` trigger is one more webhook that can be dropped —
# GitHub throttled exactly those for hours on 2026-08-06 — and a deploy that
# never starts reports nothing, which is the one failure this repo has already
# been bitten by twice. An explicit API call from a step that is already running
# either happens or fails loudly inside a run someone is watching.
#
# ORDERING DOES NOT MAKE A BREAKING CHANGE SAFE, and nothing here pretends
# otherwise. The frontend still lands last — parent update, site build, then a
# Cloudflare edge cache that took 7 minutes to turn over on 2026-08-06 — so any
# change that alters the request/response contract needs the backend to accept
# BOTH shapes until the bundle is out. What this ordering buys is narrower: the
# backend never ships a contract the frontend could not ship against.
on:
  workflow_dispatch: # Manual trigger, and how publish.yml chains to this.

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ fromJSON(vars.CI_RUNNER) }}
    steps:
      - name: Mark the start, so the reported duration is real
        run: echo "JOB_STARTED_AT=$(date -u +%s)" >> "$GITHUB_ENV"

      - name: Trigger hadoku_site to redeploy both pm2 services
        env:
          HADOKU_SITE_TOKEN: ${{ secrets.HADOKU_SITE_TOKEN }}
        run: |
          # tenhands is two pm2 services on the prod host: the Flask
          # backend (`tenhands`) and the Temporal worker
          # (`tenhands-temporal`). Both run from the same repo
          # checkout via services/pm2/tenhands-wrapper.mjs with
          # different script args. We need to redeploy BOTH on every
          # push — until 2026-05-09 only the Flask app was redeployed,
          # which silently left the worker on stale code (the
          # 2026-05-09 cktest-runner test_command_synthesizer commit
          # was the proof point: synth landed in main but didn't
          # actually run because the worker process never restarted).
          if [ -z "$HADOKU_SITE_TOKEN" ]; then
            echo "❌ Error: HADOKU_SITE_TOKEN not available"
            exit 1
          fi

          dispatch_one() {
            local service="$1"
            echo "→ requesting redeploy: $service"
            local payload
            payload=$(cat <<EOF
          {
            "event_type": "redeploy_service",
            "client_payload": {
              "service": "$service",
              "sha": "${{ github.sha }}",
              "ref": "${{ github.ref }}"
            }
          }
          EOF
            )
            local status_code
            status_code=$(curl -sS \
              -o /dev/null \
              -w "%{http_code}" \
              -X POST "https://api.github.com/repos/${{ vars.DEPLOY_TARGET_REPO || 'WolffM/hadoku_site' }}/dispatches" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $HADOKU_SITE_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "$payload")
            if [ "$status_code" = "204" ]; then
              echo "  ✅ $service redeploy requested"
              return 0
            else
              echo "  ❌ $service dispatch failed (HTTP $status_code)"
              return 1
            fi
          }

          # Fire both. We don't bail on the first failure — if the
          # Flask redeploy fails but the worker redeploy succeeds (or
          # vice versa), still surface what landed instead of leaving
          # the user guessing which half deployed.
          rc=0
          dispatch_one "tenhands"          || rc=1
          dispatch_one "tenhands-temporal" || rc=1
          exit $rc

      - name: Report the outcome so a silent failure can't hide
        # Why a job reports at all, and why this is referenced rather than
        # vendored, are both in WolffM/hadoku-actions.
        if: always()
        uses: WolffM/hadoku-actions/report-job@v1
        with:
          job-name: tenhands:deploy
          service-key: ${{ secrets.KEY_SERVICE_TENHANDS }}
          started-at: ${{ env.JOB_STARTED_AT }}
